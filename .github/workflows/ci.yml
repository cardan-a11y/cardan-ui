name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

# A newer push to the same branch or pull request replaces the run before it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install packages
        run: pnpm install

      - name: Run linter
        run: pnpm run lint

      - name: Check types
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      # Catches what only a production build finds, such as a bundled icon
      # that does not exist
      - name: Build the playground
        run: pnpm build
